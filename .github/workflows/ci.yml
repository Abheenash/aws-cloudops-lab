name: ci
on: [push, pull_request]
jobs:
  automation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest tests -q
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=brownfield init -backend=false && terraform -chdir=brownfield validate
      - uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          quiet: true
          soft_fail: false
  runbooks-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every alarm's runbook reference must exist
        run: |
          set -e
          for f in $(grep -ho 'runbooks/[a-z0-9-]*\.md' terraform/observability.tf | sort -u); do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "all alarm runbooks present"
