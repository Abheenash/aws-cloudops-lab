[defaults]
inventory            = inventory/aws_ec2.yml
roles_path           = roles
host_key_checking    = False
stdout_callback      = yaml
interpreter_python   = auto_silent
# The instances have no inbound SSH (IMDSv2-only, no key pair). Connection is via
# SSM Session Manager, which is also how a real locked-down fleet is reached.
remote_tmp           = /tmp/.ansible-${USER}/tmp

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
pipelining = True
