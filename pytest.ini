[pytest]
# Scope collection to this repo's own tests. Without this, a bare `pytest` at the
# repo root walks into ansible/collections/ — ansible-galaxy vendors thousands of
# upstream test files there — and dies during collection. CI already passes an
# explicit path; this makes the bare command behave the same way.
testpaths = tests
norecursedirs = ansible/collections .terraform .git __pycache__ build
